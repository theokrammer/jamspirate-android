name: Build & Release Android APK

on:
  # Manual trigger: run anytime from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_title:
        description: 'Release Title'
        required: false
        default: 'Jamspirate! v1.0.0'
        type: string
      build_type:
        description: 'Build variant to produce'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean

  # -------------------------------------------------------------
  # Automatic triggers (disabled for now).
  # To re-activate automatic release builds whenever a Git tag is pushed,
  # uncomment the section below:
  # -------------------------------------------------------------
  # push:
  #   tags:
  #     - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Signing Keystore
        if: ${{ inputs.build_type == 'release' && secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/my-upload-key.jks"
          echo "KEYSTORE_PATH=${{ runner.temp }}/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: ./gradlew assembleDebug

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_type == 'release' && 'jamspirate-release-apk' || 'jamspirate-debug-apk' }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_title != '' && inputs.release_title || inputs.tag_name }}
          files: app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: ${{ inputs.is_prerelease }}
          generate_release_notes: true
